<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我不打你，我打你的供應商｜立體版（虛構情境）</title>
<style>
:root{
  --bg0:#070B16; --bg1:#101A31; --ink:#EAF0FA; --ink2:#9BA8C0; --rule:#2A3654; --panel:rgba(13,20,38,.92); --panel2:#162038;
  --red:#FF5A5F; --redsoft:rgba(255,90,95,.16); --redglow:rgba(255,90,95,.7); --blue:#58A8FF; --bluesoft:rgba(88,168,255,.16); --blueglow:rgba(88,168,255,.65); --amber:#FFBE55;
  --plat:#17233F; --platside:#0C1426; --platline:rgba(120,165,255,.34); --home:#1C3260; --grid:rgba(140,170,230,.07);
  --sans:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --serif:"Songti TC","Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","PMingLiU",serif;
  --rx:56deg; --rz:-26deg; --s:1; --ls:1; --cx:50%; --cy:44%;
}
body.light{
  --bg0:#E9EDF3; --bg1:#F6F8FB; --ink:#161B24; --ink2:#515B6C; --rule:#C2C9D6; --panel:rgba(255,255,255,.95); --panel2:#F0F3F8;
  --red:#B4232A; --redsoft:rgba(180,35,42,.1); --redglow:rgba(180,35,42,.35); --blue:#1D4F91; --bluesoft:rgba(29,79,145,.1); --blueglow:rgba(29,79,145,.35); --amber:#8A5A00;
  --plat:#FFFFFF; --platside:#C9D2E0; --platline:rgba(29,79,145,.4); --home:#DCE8FA; --grid:rgba(30,50,90,.07);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:clamp(15px,.98vw,20px)}
body{margin:0;height:100vh;overflow:hidden;background:var(--bg0);color:var(--ink);font-family:var(--sans);line-height:1.55;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.bar{flex:none;display:flex;gap:1rem;align-items:center;padding:.45rem .9rem;border-bottom:1px solid var(--rule);background:var(--panel);z-index:5}
.bar h1{font-family:var(--serif);font-size:1.3rem;letter-spacing:.03em;line-height:1.2;white-space:nowrap}
.bar .sub{font-size:.72rem;color:var(--ink2);white-space:nowrap}
@media (max-width:1500px){.bar .sub{display:none}.bar h1{font-size:1.12rem}}
.pills{display:flex;gap:.35rem;margin:0 auto}
.pill{border:1px solid var(--rule);background:transparent;border-radius:2rem;padding:.2rem .8rem;font-size:.82rem;white-space:nowrap;text-align:left}
.pill b{margin-right:.4rem}
.pill small{color:var(--ink2);font-size:.74rem}
.pill[aria-pressed="true"]{border-color:var(--red);background:var(--redsoft)}
.pill .v-stop,.pill .v-limit{color:var(--blue)} .pill .v-open,.pill .v-gamble{color:var(--red)}
.tools{display:flex;gap:.35rem;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.tools button,.tools label{font-size:.78rem;border:1px solid var(--rule);background:transparent;padding:.22rem .55rem;border-radius:3px;white-space:nowrap;color:var(--ink)}
.tools button[aria-pressed="true"],.tools button.arm{background:var(--ink);color:var(--bg0)}
.tools button:disabled{opacity:.4;cursor:default}
.tools label{display:inline-flex;gap:.3rem;align-items:center;cursor:pointer}

.vp{flex:1 1 auto;position:relative;overflow:hidden;min-height:0;perspective:1700px;perspective-origin:var(--cx) var(--cy);background:radial-gradient(120% 90% at 60% 30%,var(--bg1),var(--bg0));touch-action:none;cursor:grab}
.vp.drag{cursor:grabbing}
.world{position:absolute;left:var(--cx);top:var(--cy);width:1200px;height:640px;margin:-320px 0 0 -600px;transform-style:preserve-3d;transform:scale(var(--s)) rotateX(var(--rx)) rotateZ(var(--rz))}
.world *{transform-style:preserve-3d}
.ground{position:absolute;left:-160px;top:-120px;right:-160px;bottom:-110px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;border:1px solid var(--grid)}
.ref{position:absolute;width:2px;height:2px;visibility:hidden}
.box{position:absolute}
.box>.top{position:absolute;left:0;top:0;right:0;bottom:0;transform:translateZ(var(--h));background:var(--plat);border:1.5px solid var(--platline)}
.box>.front{position:absolute;left:0;top:100%;width:100%;height:var(--h);transform-origin:0 0;transform:rotateX(90deg);background:var(--platside);border:1px solid var(--platline)}
.box>.side{position:absolute;top:0;width:var(--h);height:100%;transform-origin:0 0;transform:rotateY(-90deg);background:var(--platside);border:1px solid var(--platline)}
.box>.side.r{left:100%} .box>.side.l{left:0}
.plat.far>.top{opacity:.55;border-style:dashed}
.plat.mid>.top{opacity:.8}
.plat.home>.top{background:var(--home);border-color:var(--blue);box-shadow:0 0 34px var(--bluesoft) inset}
.plat.home.engine>.top{box-shadow:0 0 0 4px var(--blue),0 0 40px var(--blue)}
.core>.top{background:var(--blue);border-color:#fff;box-shadow:0 0 26px var(--blue)}
.core>.front,.core>.side{background:var(--blue);opacity:.75;border-color:rgba(255,255,255,.5)}
.core.hit>.top{background:var(--red);box-shadow:0 0 30px var(--red)}
.core.hit>.front,.core.hit>.side{background:var(--red)}
.clab.hit{border-color:var(--red);color:var(--red)}
.bb{position:absolute;transform-origin:0 0;white-space:nowrap;transform:translate3d(0,0,var(--z,60px)) rotateZ(calc(var(--rz)*-1)) rotateX(calc(var(--rx)*-1)) scale(var(--ls)) translate(-50%,-100%)}
.clab{font-size:13px;font-weight:700;background:var(--panel);border:1px solid var(--blue);padding:1px 7px;border-radius:2px;pointer-events:none}
.flab{font-size:12.5px;padding:1px 7px;border-radius:2px;border:1px solid var(--blue);color:var(--blue);background:var(--panel);pointer-events:none}
.flab.off{border-color:var(--rule);color:var(--ink2);border-style:dashed}
.law{position:absolute;width:190px;height:118px;transform-origin:0 0;transform:translate3d(0,0,44px) rotateX(-90deg) translate(-50%,-100%);background:linear-gradient(to bottom,transparent,var(--bluesoft) 55%,var(--blue));opacity:.5;pointer-events:none;border-left:1px solid var(--blue);border-right:1px solid var(--blue)}
.seg{position:absolute;height:6px;margin-top:-3px;transform-origin:0 50%;border-radius:3px;pointer-events:none}
.seg.flow{background:repeating-linear-gradient(90deg,var(--red) 0 14px,transparent 14px 24px);background-size:24px 100%;box-shadow:0 0 16px 3px var(--redglow);animation:flowbg .9s linear infinite}
.seg.todo,.seg.dimr,.seg.gone{height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,var(--red) 0 4px,transparent 4px 13px);opacity:.6}
.seg.dimr{opacity:.32}
.seg.gone{background:repeating-linear-gradient(90deg,var(--ink2) 0 4px,transparent 4px 13px)}
.seg.rail{height:5px;margin-top:-2.5px;background:var(--rule)}
.seg.rail.lit{height:10px;margin-top:-5px;background:var(--blue);box-shadow:0 0 20px 4px var(--blueglow)}
.seg.rail.never{height:3px;background:repeating-linear-gradient(90deg,var(--ink2) 0 3px,transparent 3px 12px);opacity:.7}
.seg.rail.cert{height:10px;margin-top:-5px;background:repeating-linear-gradient(90deg,var(--blue) 0 6px,transparent 6px 12px)}
.flat{position:absolute;white-space:nowrap;pointer-events:none}
.flat.axis{font-size:19px;color:var(--ink2);letter-spacing:.08em}
.flat.pname b{display:block;font-size:31px;line-height:1.15;letter-spacing:.04em}
.flat.pname span{font-size:17px;color:var(--ink2)}
.flat.pname.home b{color:var(--blue)}
.flat.pname.far{opacity:.7}
.flat.rlabel{font-size:18px;color:var(--ink2)}
.flat.rlabel.on{color:var(--blue);font-weight:700}
.disc{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid var(--red);background:var(--redsoft);transform:translateZ(var(--z,20px))}
.disc.dim{opacity:.3} .disc.gone{border-color:var(--ink2);background:transparent;opacity:.5} .disc.hid{border-style:dashed;opacity:.45}
.wall{position:absolute;width:74px;height:54px;transform-origin:0 0;transform:translate3d(0,0,var(--z,20px)) rotateZ(90deg) rotateX(-90deg) translate(-50%,-100%);pointer-events:none}
.wall i{display:block;width:100%;height:100%;transform-origin:50% 100%;border:2px solid var(--blue)}
.wall.open i{border:1.5px dashed var(--ink2);opacity:.35;height:8px;margin-top:46px}
.wall.paper i{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--blueglow) 6px 8px);border-style:dashed;opacity:.85}
.wall.locked i{background:linear-gradient(to top,var(--blue),var(--bluesoft));box-shadow:0 0 22px var(--blue)}
.wall.stale i{border-color:var(--amber);border-style:dashed;background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,190,85,.25) 7px 9px)}
.wall.dim{opacity:.25}
.badge{--z:54px;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--red);background:var(--panel);color:var(--ink);border-radius:20px;padding:2px 10px 2px 8px;font-size:15px;font-weight:700;cursor:pointer}
.badge .n{font-family:var(--serif);font-size:18px;color:var(--red)}
.badge.hid{border-style:dashed;color:var(--ink2);border-color:var(--ink2);font-weight:400}
.badge.dim{opacity:.4}
.badge.gone{border-color:var(--ink2);opacity:.6}
.badge.cur{--z:74px;border-width:2.5px;box-shadow:0 0 0 3px var(--redsoft),0 0 20px var(--red);font-size:16px}
.badge svg{flex:none}
.rlab{--z:40px;font-size:13.5px;border:1px solid var(--red);color:var(--red);background:var(--panel);padding:1px 8px;border-radius:2px;cursor:pointer}
.rlab.sel{background:var(--red);color:#fff;font-weight:700}
body.light .rlab.sel{color:#fff}
.token{--z:118px;pointer-events:none;text-align:center;font-size:13px;font-weight:700;color:var(--red)}
.token i{display:block;width:22px;height:22px;margin:0 auto 2px;background:var(--red);transform:rotate(45deg);box-shadow:0 0 18px var(--red)}
@keyframes flowbg{to{background-position:24px 0}}
@keyframes drop{from{opacity:0;transform:translateZ(260px)}to{opacity:1;transform:translateZ(0)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{opacity:0}to{opacity:1}}
.world.intro .plat{animation:drop .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.28s)}
.world.intro .pname{animation:pop .6s both;animation-delay:.9s}
.world.anim .wall.chg i{animation:rise .7s cubic-bezier(.2,.9,.2,1) both}
.world.anim .fresh{animation:pop .6s both}
body.rm .world *{animation:none!important}
@media (prefers-reduced-motion:reduce){.world *{animation:none!important}}

/* 對話框 */
.talk{position:absolute;left:.7rem;bottom:.7rem;right:calc(var(--dw,0px) + 1.4rem);background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--red);padding:.45rem .9rem .55rem;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:.2rem 1.2rem;z-index:3;cursor:auto;max-height:42%;overflow:auto}
.talk.coach{border-top-color:var(--blue)}
.talk.one{grid-template-columns:1fr}
.who{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--red)}
.coach .who{color:var(--blue)}
.line{font-family:var(--serif);font-size:1.14rem;line-height:1.5;margin:.15rem 0 .25rem}
.line.red{color:var(--red)}
.stepmeta{font-size:.82rem;color:var(--ink2);display:flex;gap:.5rem;flex-wrap:wrap;align-items:baseline}
.stepmeta b{color:var(--ink);font-size:.98rem}
.stepmeta .rt{font-size:.76rem;border-right:1px solid var(--rule);padding-right:.5rem}
.stepmeta .th{color:var(--red);border:1px solid var(--red);padding:0 .35em;font-size:.74rem;white-space:nowrap}
.coachline{font-size:.95rem;border-left:3px solid var(--blue);padding-left:.6rem;margin:.35rem 0}
.gate{font-size:.82rem;margin-top:.35rem;display:flex;gap:.3rem .6rem;flex-wrap:wrap;align-items:center}
.gate b{font-size:.88rem}
.gs{font-weight:700;font-size:.74rem;padding:0 .4em;border:1px solid currentColor;white-space:nowrap}
.gs.open{color:var(--red)} .gs.paper{color:var(--ink)} .gs.locked{color:var(--blue)} .gs.stale{color:var(--amber)}
.gate .why{flex-basis:100%;color:var(--ink2);font-size:.78rem}
.gate .role{color:var(--ink2);font-size:.76rem}
.gate summary{cursor:pointer;text-decoration:underline;text-underline-offset:.2em}
.chip{border:1px solid var(--ink2);background:transparent;border-radius:3px;padding:.1rem .5rem .1rem 1.4rem;font-size:.78rem;position:relative}
.chip::before{content:"";position:absolute;left:.38rem;top:.36rem;width:.68rem;height:.68rem;border:1.5px solid var(--ink2)}
.chip[aria-pressed="true"]{border:2px solid var(--blue);background:var(--bluesoft);font-weight:700}
.chip[aria-pressed="true"]::before{background:var(--blue);border-color:var(--blue)}
.nav{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem;align-items:center}
.btn{border:1px solid var(--ink2);background:transparent;border-radius:3px;padding:.3rem .8rem;font-size:.86rem;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.go{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;font-size:.95rem;padding:.4rem 1.1rem}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#06101F;font-weight:700;font-size:.95rem;padding:.4rem 1.1rem}
body.light .btn.blue{color:#fff}
.btn.link{border:0;text-decoration:underline;text-underline-offset:.2em;color:var(--ink2);padding:.3rem .3rem}
.dmg h4{font-size:.8rem;color:var(--red);margin-bottom:.15rem}
.dmg li{display:grid;grid-template-columns:3.6em 1fr;gap:.4rem;font-size:.82rem;padding:.1rem 0;border-top:1px dotted var(--rule)}
.dmg li:first-child{border-top:0}
.ds{font-size:.72rem;font-weight:700;white-space:nowrap;padding-top:.1rem}
.ds.open{color:var(--red)} .ds.closed{color:var(--blue)} .ds.paper{color:var(--amber)}
.dmg li.closed .dt{text-decoration:line-through;color:var(--ink2)}
.dmg em{display:block;font-style:normal;color:var(--blue)}
.resid{font-size:.76rem;color:var(--ink2);margin-top:.25rem;border-left:3px solid var(--ink2);padding-left:.5rem;line-height:1.45}
.msg{grid-column:1/-1;font-size:.76rem;color:var(--ink2);border-bottom:1px dotted var(--rule);padding-bottom:.2rem;margin-bottom:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg strong{color:var(--ink)}

/* 動力盤 */
.drawer{position:absolute;right:.7rem;top:.7rem;bottom:.7rem;width:19.5rem;background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--blue);padding:.55rem .65rem;overflow:auto;z-index:3;cursor:auto}
.drawer h2{font-size:1rem;display:flex;justify-content:space-between;align-items:baseline}
.drawer h2 small{font-weight:400;font-size:.72rem;color:var(--ink2)}
.q{display:flex;gap:.3rem .5rem;align-items:center;justify-content:space-between;margin:.35rem 0 .45rem;padding:.35rem .5rem;background:var(--panel2);font-size:.82rem;flex-wrap:wrap}
.q small{flex-basis:100%;font-size:.72rem;color:var(--ink2)}
.src{margin-top:.5rem}
.src h3{font-size:.9rem;display:flex;gap:.45rem;align-items:baseline}
.src h3 small{font-size:.68rem;font-weight:400;color:var(--blue);border:1px solid var(--blue);padding:0 .35em}
.src>p{font-size:.72rem;color:var(--ink2);line-height:1.4;margin-bottom:.25rem}
.lv{display:block;width:100%;text-align:left;border:1px solid var(--ink2);background:transparent;border-radius:3px;padding:.22rem .45rem .28rem 1.7rem;position:relative;margin-bottom:.25rem}
.lv::before{content:"";position:absolute;left:.45rem;top:.48rem;width:.8rem;height:.8rem;border:1.5px solid var(--ink2)}
.lv[aria-pressed="true"]{border:2px solid var(--blue);background:var(--bluesoft)}
.lv[aria-pressed="true"]::before{background:var(--blue);border-color:var(--blue)}
.lv b{display:block;font-size:.84rem;line-height:1.3}
.lv small{display:block;font-size:.7rem;color:var(--ink2);line-height:1.35}
.lv .res{color:var(--blue);font-weight:700}
.lv .aff{color:var(--ink)}
.lv b i{font-style:normal;font-weight:400;font-size:.66rem;color:var(--amber);border:1px solid var(--amber);padding:0 .3em;margin-left:.4em;white-space:nowrap;vertical-align:.1em}
.lv.rel{border-color:var(--amber)}
.lv[aria-disabled="true"]{opacity:.32}
.lv.hint{box-shadow:0 0 0 3px var(--amber);opacity:1}

/* 回到題目、文字版 */
.sheet{position:absolute;left:50%;top:1rem;bottom:1rem;width:min(46rem,92%);transform:translateX(-50%);background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--ink);z-index:6;overflow:auto;padding:1rem 1.2rem 1.4rem;cursor:auto}
.sheet h2{font-family:var(--serif);font-size:1.4rem}
.sheet h3{font-size:.88rem;margin:1rem 0 .35rem;padding-top:.5rem;border-top:1px solid var(--rule)}
.sheet p{font-size:.92rem;margin:.3rem 0 .5rem;max-width:40em}
.sheet .x{float:right}
.sum{border:1px solid var(--rule)}
.sum li{display:grid;grid-template-columns:7.4em 1fr;gap:.5rem;padding:.35rem .55rem;border-top:1px solid var(--rule);font-size:.86rem}
.sum li:first-child{border-top:0}
.log li{border-top:1px solid var(--rule);padding:.35rem 0;font-size:.82rem}
.log .c{color:var(--ink2);font-size:.76rem}
#textview{position:absolute;left:0;top:0;right:0;bottom:0;overflow:auto;background:var(--bg0);padding:1rem 1.3rem;z-index:4;cursor:auto}
#textview h2{font-family:var(--serif);font-size:1.15rem;margin:1.1rem 0 .4rem}
#textview p{font-size:.9rem;max-width:48em;margin-bottom:.4rem}
table{border-collapse:collapse;width:100%;font-size:.82rem;margin-bottom:.4rem}
th,td{border:1px solid var(--rule);padding:.3rem .5rem;text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:700}
.hintcam{position:absolute;left:.8rem;top:.6rem;font-size:.72rem;color:var(--ink2);z-index:2;pointer-events:none}
@media (max-width:900px){.drawer{position:static;width:auto;margin:.5rem}.talk{position:static;margin:.5rem;right:auto;max-height:none}body{height:auto;overflow:auto}.vp{min-height:34rem;overflow:visible}.world{position:relative;left:50%;top:14rem}}
</style>
</head>
<body>
<header class="bar">
  <div><h1>我不打你，我打你的供應商</h1><div class="sub">紅隊視角看供應鏈與第三方管理｜虛構情境，不對應任何真實企業或事件</div></div>
  <div class="pills" id="pills" role="group" aria-label="紅隊的三條路線"></div>
  <div class="tools" role="toolbar" aria-label="檢視與控制">
    <button type="button" id="btnBack">總結</button>
    <button type="button" id="btnCam">視角：立體</button>
    <button type="button" id="btnTheme" aria-pressed="false">亮色</button>
    <button type="button" id="btnView" aria-pressed="false">文字版</button>
    <button type="button" id="btnUndo">上一步</button>
    <button type="button" id="btnReset">重置</button>
    <label><input type="checkbox" id="chkRm"> 減少動態</label>
  </div>
</header>
<main class="vp" id="vp">
  <div class="hintcam" id="hintcam">拖曳空白處可旋轉視角</div>
  <div class="world" id="world" role="group" aria-label="立體場景：四層供應鏈平台與紅隊路線"></div>
  <div id="textview" hidden tabindex="0" aria-label="文字版"></div>
  <section class="talk" id="talk" aria-label="說明"></section>
  <aside class="drawer" id="drawer" aria-label="GRC 動力盤" hidden></aside>
  <div class="sheet" id="sheet" role="dialog" aria-label="總結：回到題目" hidden></div>
</main>
<div id="live" class="sr" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var NUM=['①','②','③'],CN=['一','二','三'];

/* ───────── 動力源與措施 ───────── */

   +'<li><b>化未知為已知</b><span>「知道自己用了哪些元件」：'+GS[gstate('g4',w)]+'。「知道有託管這一層」：'+GS[gstate('g7',w)]+'。</span></li>'
   +'<li><b>處理未知</b><span>三條路線各有擋不住的部分。為它準備的關卡：操作紀錄（'+GS[gstate('g3',w)]+'）、還原演練（'+GS[gstate('g8',w)]+'）、資料帶得走（'+GS[gstate('g9',w)]+'）。</span></li>'
   +'<li><b>持續管理</b><span>現在是第 '+w.q+' 季；需重新確認的關卡 '+c.stale+' 個。鎖上的關卡會因為對方的變動而失效。</span></li></ul>'
   +'<h3>四個動力源各做什麼</h3><ul class="sum">'
   +'<li><b>法令</b><span>壓力。只壓在你身上：委外移轉的是執行，要求、確認、處置的位置還在公司這裡。</span></li>'
   +'<li><b>契約</b><span>傳動。把要求帶到供應商；沒寫明的下一層到不了，沒有契約的上游永遠到不了。</span></li>'
   +'<li><b>標準與認證</b><span>借力。有效範圍以證書與報告寫明的為準，不會自動涵蓋你用的那項服務。</span></li>'
   +'<li><b>內部政策</b><span>引擎。沒有自己人定期去查，條款只是紙上關卡。</span></li></ul><h3>紀錄</h3>';
  h+=w.log.length?'<ol class="log">'+w.log.slice().reverse().map(function(l){return '<li><b>'+l.n+'. '+esc(l.title)+'</b>　<span class="c">第 '+l.q+' 季</span><div>'+esc(l.text)+'</div>'+(l.lines.length?'<div class="c">關卡變化：'+esc(l.lines.join('；'))+'</div>':'')+'</li>';}).join('')+'</ol>':'<p>還沒有任何動作。</p>';
  el.innerHTML=h;}
function renderText(){var w=W,h='<h2>情境</h2><p>虛構情境。你是一家企業的資安負責人，線上客戶服務委託供應商 A 建置及維運；A 把託管交給業者 B；產品裡還有上游元件。紅隊受託演練，條件是不碰公司自己的系統；他們提出三條全部從供應鏈進來的路線。</p><p>目前是第 '+w.q+' 季，已接上 '+Object.keys(w.on).length+'／'+LV.length+' 項措施。'+(w.tour>=0?'導覽進行中；按「跳過導覽」可直接開放全部功能。':'')+'</p>';
  ROUTES.forEach(function(r,i){var e=evalRoute(r,w);
    h+='<h2>路線'+CN[i]+'：'+r.name+'（'+r.tag+'）｜'+e.v.t+'</h2><p>紅隊：「'+esc(r.intro)+'」</p><table><thead><tr><th>步驟</th><th>威脅</th><th>發生在</th><th>紅隊的說法</th><th>關卡與狀態</th><th>提出要求</th><th>確認做到</th></tr></thead><tbody>';
    r.steps.forEach(function(st,j){var gs=e.st[j],g=G[st.g],gone=e.stop>=0&&j>e.stop,f=function(a){return a.map(function(l){return SRC[LB[l].src].name+'｜'+LB[l].name+(on(w,l)?'（已接上）':'（未接上）');}).join('<br>');};
      h+='<tr><th scope="row">'+NUM[j]+' '+esc(st.title)+'</th><td>'+st.threat+'</td><td>'+st.tier+'</td><td>'+(gone?'前面已被擋下，走不到這一步。':esc(st.say[sayKey(gs)]))+'</td><td>'+esc(g.name)+'：'+GS[gs]+'。'+GSD[gs]+'</td><td>'+f(g.req)+'</td><td>'+f(g.ver)+'</td></tr>';});
    h+='</tbody></table><p>潛在損害：'+e.dm.map(function(d){return esc(d.t)+'〔'+(d.k==='closed'?(d.after&&!d.moot?'已縮小為：'+d.after:'已避免'):d.k==='paper'?'賭運氣':'會發生')+'〕';}).join('；')+'。</p><p>擋不住的部分：'+esc(r.resid)+'</p>';});
  h+='<h2>GRC 動力盤</h2><table><thead><tr><th>動力源</th><th>作用與射程</th><th>可接上的措施</th><th>狀態</th><th>代價</th></tr></thead><tbody><tr><th scope="row">法令</th><td>'+SRC.L.role+'。'+SRC.L.reach+'。'+SRC.L.text+'</td><td>（一直都在，不能開關）</td><td>—</td><td>—</td></tr>';
  LV.forEach(function(l){var s=SRC[l.src];h+='<tr><th scope="row">'+s.name+'</th><td>'+s.role+'。'+s.reach+'。</td><td>'+esc(l.name)+'：'+esc(l.desc)+(l.res&&on(w,l.id)?'<br>'+esc(l.res):'')+'</td><td>'+(on(w,l.id)?'第 '+w.on[l.id]+' 季接上':'未接上')+'<br>作用於：'+esc(l.aff)+'</td><td>'+esc(l.cost)+'</td></tr>';});
  h+='</tbody></table><h2>紀錄</h2>'+(w.log.length?'<ol>'+w.log.map(function(l){return '<li>'+l.n+'.（第 '+l.q+' 季）'+esc(l.title)+'：'+esc(l.text)+(l.lines.length?' 關卡變化：'+esc(l.lines.join('；')):'')+'</li>';}).join('')+'</ol>':'<p>還沒有任何動作。</p>');
  $('#textview').innerHTML=h;}

/* ───────── 版面與總繪製 ───────── */
function fit(){var vp=$('#vp'),r=vp.getBoundingClientRect(),dr=$('#drawer'),tk=$('#talk');if(!r.width)return;
  var dw=dr.hidden?0:dr.offsetWidth,th=tk.offsetHeight,aw=r.width-dw-(dw?20:0),ah=r.height-th-16;
  vp.style.setProperty('--dw',dw+'px');
  if(UI.view!=='scene'||aw<50||ah<50)return;
  var s=parseFloat(vp.style.getPropertyValue('--s'))||.8,cx=aw/2,cy=ah/2,refs=document.querySelectorAll('#world .ref'),it,i;
  for(it=0;it<4;it++){
    vp.style.setProperty('--s',s.toFixed(3));vp.style.setProperty('--ls',Math.max(1,Math.min(1.35,.98/s)).toFixed(3));vp.style.setProperty('--cx',cx.toFixed(0)+'px');vp.style.setProperty('--cy',cy.toFixed(0)+'px');
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(i=0;i<refs.length;i++){var b=refs[i].getBoundingClientRect();x0=Math.min(x0,b.left);x1=Math.max(x1,b.right);y0=Math.min(y0,b.top);y1=Math.max(y1,b.bottom);}
    if(x1<=x0||y1<=y0)break;
    var k=Math.min((aw-16)/(x1-x0),(ah-12)/(y1-y0));s=Math.max(.3,Math.min(1.8,s*k));
    cx+=(aw/2)-((x0+x1)/2-r.left);cy+=(ah/2)-((y0+y1)/2-r.top);
  }
  vp.style.setProperty('--s',s.toFixed(3));vp.style.setProperty('--ls',Math.max(1,Math.min(1.35,.98/s)).toFixed(3));vp.style.setProperty('--cx',cx.toFixed(0)+'px');vp.style.setProperty('--cy',cy.toFixed(0)+'px');}
function render(){
  var ae=document.activeElement,key=ae&&ae.getAttribute?ae.getAttribute('data-k'):null;
  document.body.classList.toggle('rm',UI.rm);document.body.classList.toggle('light',UI.light);
  $('#world').hidden=UI.view!=='scene';$('#textview').hidden=UI.view!=='text';$('#hintcam').hidden=UI.view!=='scene';
  renderPills();renderDrawer();renderTalk();
  if(UI.view==='scene')renderWorld();else renderText();
  renderSheet();
  $('#btnView').setAttribute('aria-pressed',UI.view==='text');$('#btnTheme').setAttribute('aria-pressed',UI.light);
  $('#btnCam').textContent='視角：'+(UI.camFree?'自訂':CAMS[UI.cam][0]);
  $('#btnBack').hidden=W.tour>=0&&W.tour<4;
  $('#btnUndo').disabled=!H.length;
  var br=$('#btnReset');br.textContent=UI.arm?'再按一次確認重置':'重置';br.classList.toggle('arm',UI.arm);
  fit();
  if(key){var t=document.querySelector('[data-k="'+key+'"]');if(t&&t!==document.activeElement){try{t.focus({preventScroll:true});}catch(err){t.focus();}}}
  UI.animate=false;UI.fresh=[];
}

/* ───────── 事件 ───────── */
function closest(el,attr){while(el&&el!==document&&el.getAttribute){if(el.hasAttribute(attr))return el;el=el.parentNode;}return null;}
document.addEventListener('click',function(ev){var t=ev.target,el,was=UI.arm;UI.arm=false;
  if((el=closest(t,'data-lv'))){toggle(el.getAttribute('data-lv'));return;}
  if((el=closest(t,'data-rv'))){reverify(el.getAttribute('data-rv'));return;}
  if(closest(t,'data-nextq')){nextQ();return;}
  if(closest(t,'data-next')){stepNext();return;}
  if(closest(t,'data-prev')){stepPrev();return;}
  if(closest(t,'data-start')){tourStart();return;}
  if(closest(t,'data-skip')){tourSkip();return;}
  if(closest(t,'data-tour2')){W.tour=2;UI.cur=0;UI.animate=false;render();say('換你。接上契約的存取與稽核條款。');var k=document.querySelector('[data-k="tk:K1"]');if(k)k.focus();return;}
  if(closest(t,'data-sum')){UI.sheet=true;render();var x=document.querySelector('[data-closesheet]');if(x)x.focus();return;}
  if(closest(t,'data-closesheet')){UI.sheet=false;render();$('#btnBack').focus();return;}
  if((el=closest(t,'data-step'))){pickRoute(el.getAttribute('data-route'),+el.getAttribute('data-step'));return;}
  if((el=closest(t,'data-route'))){pickRoute(el.getAttribute('data-route'),null);return;}
  if(was)render();
});
document.addEventListener('keydown',function(ev){var k=ev.key;
  if(k==='Escape'){if(UI.sheet){UI.sheet=false;render();$('#btnBack').focus();}else if(UI.arm){UI.arm=false;render();}}
});
$('#btnBack').addEventListener('click',function(ev){ev.stopPropagation();UI.arm=false;UI.sheet=!UI.sheet;render();if(UI.sheet){var x=document.querySelector('[data-closesheet]');if(x)x.focus();}});
$('#btnCam').addEventListener('click',function(ev){ev.stopPropagation();UI.arm=false;UI.cam=UI.camFree?0:(UI.cam+1)%CAMS.length;UI.camFree=null;render();say('視角：'+CAMS[UI.cam][0]+'。');});
$('#btnTheme').addEventListener('click',function(ev){ev.stopPropagation();UI.arm=false;UI.light=!UI.light;render();});
$('#btnView').addEventListener('click',function(ev){ev.stopPropagation();UI.arm=false;UI.view=UI.view==='scene'?'text':'scene';UI.animate=false;render();say(UI.view==='text'?'已切換為文字版。':'已切換為立體場景。');});
$('#btnUndo').addEventListener('click',function(ev){ev.stopPropagation();UI.arm=false;undo();});
$('#btnReset').addEventListener('click',function(ev){ev.stopPropagation();if(UI.arm)reset();else{UI.arm=true;render();say('再按一次確認重置；按 Esc 取消。');}});
$('#chkRm').addEventListener('change',function(){UI.rm=this.checked;render();});
/* 拖曳旋轉視角：只改 CSS 變數，不重繪 */
(function(){var vp=$('#vp'),drag=null;
  vp.addEventListener('pointerdown',function(ev){if(ev.target!==vp&&!ev.target.classList.contains('ground')&&ev.target.id!=='world'&&!(ev.target.classList&&(ev.target.classList.contains('top')||ev.target.classList.contains('front')||ev.target.classList.contains('side'))))return;if(UI.view!=='scene')return;
    var cs=getComputedStyle($('#world'));drag={x:ev.clientX,y:ev.clientY,rx:parseFloat(cs.getPropertyValue('--rx')),rz:parseFloat(cs.getPropertyValue('--rz')),moved:false};vp.classList.add('drag');try{vp.setPointerCapture(ev.pointerId);}catch(e){}});
  vp.addEventListener('pointermove',function(ev){if(!drag)return;var dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)<4)return;drag.moved=true;
    var rx=Math.max(0,Math.min(72,drag.rx-dy*.25)),rz=Math.max(-55,Math.min(55,drag.rz+dx*.25));UI.camFree=[+rx.toFixed(1),+rz.toFixed(1)];
    var w=$('#world');w.style.setProperty('--rx',rx+'deg');w.style.setProperty('--rz',rz+'deg');$('#btnCam').textContent='視角：自訂';});
  function end(){if(drag){var m=drag.moved;drag=null;vp.classList.remove('drag');if(m)fit();}}
  vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);})();
window.addEventListener('resize',fit);
render();
/* 供測試使用的唯讀檢查點 */
window.__app={W:function(){return W;},UI:UI,H:function(){return H.length;},gates:gateNames,routes:function(){return ROUTES.map(function(r){var e=evalRoute(r,W);return {id:r.id,v:e.v.k,stop:e.stop,dm:e.dm.map(function(d){return d.k;})};});}};
})();
</script>
